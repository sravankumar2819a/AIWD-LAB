<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterWorld Event Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        img {
  width: 50%;
  height: auto;
  border-radius: 10px;
  display: block; /* Changes the image from inline to block-level */
  margin: 0 auto; /* Sets top/bottom margin to 0, and left/right to auto (centers it) */
}

        video, audio {
            width: 100%;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to BetterWorld</h1>
        <img src="c:\Users\STUDENTS\Downloads\3440660.jpg" alt="BetterWorld Event Banner">

        <h2>Promotional Video</h2>
        <video controls>
            <source src="c:\Users\STUDENTS\Downloads\0_Globalization_Technology_3840x2160.mov" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <h2>Event Registration Form</h2>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="date">Event Date:</label>
            <input type="date" id="date" name="date" required>

            <label>Preferred Contact Method:</label>
            <input type="radio" id="emailContact" name="contactMethod" value="email" required>
            <label for="emailContact">Email</label>
            <input type="radio" id="phoneContact" name="contactMethod" value="phone">
            <label for="phoneContact">Phone</label>

            <label for="interest">Select your interest:</label>
            <select id="interest" name="interest">
                <option value="workshop">Workshop</option>
                <option value="seminar">Seminar</option>
                <option value="networking">Networking</option>
            </select>

            <label for="comments">Additional Comments:</label>
            <textarea id="comments" name="comments" rows="4"></textarea>

            <label for="resume">Upload your resume:</label>
            <input type="file" id="resume" name="resume">

            <input type="submit" value="Register">
        </form>
    </div>

</body>
</html>
